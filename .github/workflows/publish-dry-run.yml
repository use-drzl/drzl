name: Publish Dry Run

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional npm dist-tag
        required: false
        default: latest

jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed so pnpm can request an OIDC ID token. The exchange happens before the
      # dry-run short-circuit inside `pnpm publish`, so this job really does rehearse
      # trusted publishing end to end without publishing anything.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the pnpm version from package.json -> "packageManager".
      # v6 is the first action-setup major that supports pnpm 11.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 declares engines.node ">=22.13".
          node-version: 22
          # Deliberately no `registry-url`: it writes an .npmrc containing
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}, and with no token in the
          # environment that leaves a junk credential behind. pnpm only overwrites the token
          # if the OIDC exchange succeeds, so on any failure the junk value is what gets
          # sent, turning a clear "OIDC was skipped" diagnostic into a bare 401.

      # No `-w` here. On `install`, `-w` means --workspace-root and restricts the install to
      # the root project alone, so every package under packages/ is left without its
      # dependencies: `packages/validation-core/node_modules/@drzl/analyzer` is never linked.
      # The build then dies with "TS2307: Cannot find module '@drzl/analyzer'" during the dts
      # step, which reads like a broken package and is really a half-finished install. ci.yml
      # and release.yml both use the plain form, which is why only this workflow ever failed.
      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -w build:packages

      # Deliberately NOT `changeset publish`, for two reasons:
      #  1. `changeset publish` has no dry-run mode. It builds its own argument list
      #     (--access / --tag / --otp / --no-git-checks) and forwards nothing else, so there
      #     is no way to ask it to hold back.
      #  2. `dry-run` is a CLI-only option for `pnpm publish`; it is not in that command's
      #     rc-readable option list, so the NPM_CONFIG_DRY_RUN env var this job used to rely
      #     on was silently ignored. Under pnpm 11 that turned this "dry run" into a real
      #     publish attempt which only failed because it had no credentials.
      # `pnpm publish --dry-run` does perform the full OIDC exchange for every package and
      # then skips the upload, which is precisely the rehearsal we want.
      #
      # Note: like `changeset publish`, recursive publish skips versions that already exist on
      # the registry. Dispatched against master with no pending bump it just prints "There are
      # no new packages that should be published" and exercises nothing. Dispatch it against a
      # "Version Packages" branch to actually rehearse the exchange.
      - name: Publish dry run
        env:
          # Pin the registry regardless of any runner-level npmrc.
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -o pipefail
          pnpm -r --filter='{packages/*}' publish \
            --dry-run \
            --no-git-checks \
            --tag "${{ inputs.tag || 'latest' }}" 2>&1 | tee /tmp/dry-run.log

          # pnpm treats a failed OIDC exchange as a WARNING and carries on, so without this
          # check the job goes green having authenticated nothing. That is the worst possible
          # outcome for a rehearsal: the first run of this workflow reported success while all
          # eight exchanges returned 404, which is npm's answer for "no trusted publisher is
          # configured for this package". A real publish would have got that far and then
          # failed at the upload.
          #
          # The GitHub side is not the part that breaks. Requesting the ID token returns 200
          # every time; it is the POST to npm's exchange endpoint that 404s. So grep for
          # pnpm's own marker rather than trying to infer success from the exit code.
          if grep -q 'Skipped OIDC' /tmp/dry-run.log; then
            echo
            echo "FAIL: the OIDC token exchange did not succeed for every package."
            echo "Packages whose exchange was skipped:"
            # -A1, not -B1: pnpm logs the warning first and the package it was about on the
            # NEXT line, so looking backwards silently prints nothing and the list reads as
            # "no packages affected" during the exact failure it exists to explain.
            grep -A1 'Skipped OIDC' /tmp/dry-run.log \
              | grep -oE '@drzl/[a-z-]+@[0-9][^ ]*' | sed 's/^/  /' || true
            echo
            echo "A 404 from the exchange endpoint means npm has no trusted publisher for that"
            echo "package name. Connect it on npmjs.com (Settings, Trusted Publisher, GitHub"
            echo "Actions) with organization use-drzl, repository drzl, workflow release.yml,"
            echo "and Environment left blank, then dispatch this workflow again."
            exit 1
          fi

          echo "OK: every package completed the OIDC token exchange."
