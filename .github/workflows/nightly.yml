name: nightly

# Everything in ci.yml pins the versions it measures, deliberately, so a claim in the docs is
# exactly true of a named version. The cost of that trade is that an upstream release is invisible
# until somebody opens a pull request, and then it lands on that pull request instead of on its
# own. This workflow is the other side of the trade: it runs the same gates against what the
# registry serves today, on a schedule, and it opens exactly one issue when they break.
on:
  schedule:
    # 03:20 UTC rather than the top of an hour. GitHub queues scheduled runs and drops them under
    # load, and :00 is the busiest minute of every hour by a wide margin.
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap, always runs, and it is the only job that answers "did upstream move at all". It stays
  # useful even on a day when the two expensive jobs below cannot run.
  # A version bump that reached master and never published. The release PR is authored by
  # github-actions[bot], so squash-merging it produces a bot-authored commit, and GitHub's
  # recursion guard means no workflow fires: the versions land on master, nothing reaches the
  # registry, and the only symptom is silence. That happened on 2026-08-10 and went unnoticed for
  # forty minutes, during which npm install of the CLI was broken for an unrelated reason nobody
  # could see past.
  #
  # Cheap to detect: master's package versions against what the registry serves. If master is
  # ahead and no release run exists for that commit, the release never ran and a workflow_dispatch
  # is the recovery.
  unpublished-master:
    if: github.repository == 'use-drzl/drzl'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Every version on master exists on the registry
        run: |
          set -o pipefail

          # A name absent from the registry has two causes that need opposite responses. A release
          # that failed to publish is a bug and this job exists to catch it. A brand-new package
          # whose first version has not been published by hand yet is expected, because npm trusted
          # publishing cannot authenticate a name that has never existed. They are indistinguishable
          # from the outside, so the second one is written down.
          #
          # Same file packages/cli/test/generator-registry.spec.ts reads. Two copies of this list in
          # two languages would drift, and the copy that drifted would be the one granting exemptions.
          awaiting=$(node -p "JSON.parse(require('fs').readFileSync('scripts/awaiting-first-publish.json','utf8')).packages.join(' ')")
          listed() { case " $awaiting " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }

          behind=0   # published before, master is ahead: a release that did not publish
          missing=0  # never published and not written down: a package nobody has published at all
          stale=0    # written down as unpublished, but the registry has it now

          for pkg in packages/*/package.json; do
            # `node -p` renders a boolean through util.inspect, which wraps it in colour escapes
            # whenever it thinks stdout is a terminal. The comparison below then never matches and a
            # private package is checked against the registry it was never going to be on. Writing
            # the string directly is never inspected and never coloured. Names and versions are
            # already strings, which `-p` prints raw, which is why only this one was affected.
            private=$(node -e "process.stdout.write(String(require('./$pkg').private === true))")
            [ "$private" = "true" ] && continue
            name=$(node -p "require('./$pkg').name")
            want=$(node -p "require('./$pkg').version")

            # A 404 means the name has never existed. Any other failure means npm could not answer,
            # and reporting that as "never published" would turn a network blip into a false alarm
            # against a package that is fine.
            if out=$(npm view "$name" version 2>&1); then
              have=$(printf '%s\n' "$out" | tail -1)
            elif printf '%s\n' "$out" | grep -qi "E404"; then
              have=""
            else
              echo "::error title=registry unreachable::npm view $name failed for a reason that is not a 404, so this run cannot tell a missing package from an unanswered query."
              printf '%s\n' "$out"
              exit 1
            fi

            if [ -n "$have" ] && listed "$name"; then
              echo "    $name: the registry serves $have, so its first publish has already happened"
              stale=1
              continue
            fi

            [ "$want" = "$have" ] && continue

            if [ -z "$have" ]; then
              if listed "$name"; then
                echo "    $name: awaiting its first publish by hand, master has $want"
              else
                echo "    $name: master has $want and this name has never been on the registry"
                missing=1
              fi
            else
              echo "    $name: master has $want, the registry serves $have"
              behind=1
            fi
          done

          if [ "$behind" = 1 ]; then
            echo "::error title=release never published::master carries versions the registry does not have. A squash-merged release PR is bot-authored, so no workflow fires. Recover with: gh workflow run release.yml --ref master -f dry_run=false"
            {
              echo "### A release landed on master and never published"
              echo
              echo "The versions above are on master and not on npm. The usual cause is a release"
              echo "pull request merged by squash: the commit is authored by github-actions[bot],"
              echo "so no workflow runs."
              echo
              echo "Recover with a manual dispatch of release.yml, dry_run false."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$missing" = 1 ]; then
            echo "::error title=package never published::a package on master has never existed on the registry and is not recorded as awaiting its first publish. Publish its first version by hand, then add it to scripts/awaiting-first-publish.json, or promote it if it is already published."
            {
              echo "### A package on master has never been published"
              echo
              echo "npm trusted publishing cannot authenticate a name that has never existed, so the"
              echo "first version of a new package is published by hand and every later one by CI."
              echo
              echo "Publish it, or record it in \`scripts/awaiting-first-publish.json\` so this job"
              echo "stops guessing which of the two situations it is looking at."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$stale" = 1 ]; then
            echo "::error title=first publish happened::a package recorded as awaiting its first publish is now on the registry. Remove it from scripts/awaiting-first-publish.json and promote it out of the CLI's optionalDependencies."
            {
              echo "### A first publish happened and the record was not updated"
              echo
              echo "The packages above are listed in \`scripts/awaiting-first-publish.json\` and the"
              echo "registry now serves them. The entry exempts them from this check, so leaving it"
              echo "there hides the next real failure for that package."
              echo
              echo "Delete the entry and move the package from the CLI's \`optionalDependencies\` to"
              echo "its \`dependencies\`, which is the promotion the entry was standing in for."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$behind" = 1 ] || [ "$missing" = 1 ] || [ "$stale" = 1 ]; then exit 1; fi
          echo "    every published package on master matches the registry"

  pins:
    if: github.repository == 'use-drzl/drzl'
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.resolve.outputs.latest }}
      rc: ${{ steps.resolve.outputs.rc }}
      pinned_0_4x: ${{ steps.resolve.outputs.pinned_0_4x }}
      pinned_v1: ${{ steps.resolve.outputs.pinned_v1 }}
      drifted: ${{ steps.resolve.outputs.drifted }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: resolve
        name: What the registry serves against what the gate pins
        run: |
          set -o pipefail
          latest=$(npm view drizzle-orm dist-tags.latest)
          rc=$(npm view drizzle-orm dist-tags.rc)
          read -r pinned_0_4x pinned_v1 < <(bash scripts/verify-packed.sh --print-pins)

          {
            echo "| tag | registry | gate pins |"
            echo "| --- | --- | --- |"
            echo "| latest | $latest | $pinned_0_4x |"
            echo "| rc | $rc | $pinned_v1 |"
          } >> "$GITHUB_STEP_SUMMARY"

          drifted=no
          [ "$latest" = "$pinned_0_4x" ] && [ "$rc" = "$pinned_v1" ] || drifted=yes

          # A patch move is ordinary and is reported in the summary above and nowhere else. A minor
          # or major move on the `latest` tag is different: the majors page, the comparison page
          # and the verification page all state what 0.4x does, and a new minor can falsify any of
          # them. That one is worth waking somebody for, whether or not the gate goes red.
          pinned_line=${pinned_0_4x%.*}
          latest_line=${latest%.*}
          if [ "$pinned_line" != "$latest_line" ]; then
            echo "the latest tag moved off $pinned_line to $latest" >> "$GITHUB_STEP_SUMMARY"
            echo "FAIL: drizzle-orm latest moved from $pinned_0_4x to $latest, a new minor line."
            exit 1
          fi

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "pinned_0_4x=$pinned_0_4x" >> "$GITHUB_OUTPUT"
          echo "pinned_v1=$pinned_v1" >> "$GITHUB_OUTPUT"
          echo "drifted=$drifted" >> "$GITHUB_OUTPUT"

      # The trigger in the deprecation policy, printed rather than argued. Both readings come from
      # the registry's own per-version download counts, so nobody has to estimate the split.
      - name: The 0.4x share, which the deprecation policy keys on
        run: |
          set -o pipefail
          curl -sS --fail https://api.npmjs.org/versions/drizzle-orm/last-week > /tmp/dl.json
          node -e "
            const d = JSON.parse(require('fs').readFileSync('/tmp/dl.json', 'utf8')).downloads;
            let total = 0, v1 = 0, v04 = 0, older = 0;
            for (const [v, n] of Object.entries(d)) {
              total += n;
              if (v.startsWith('1.')) v1 += n;
              else if (v.startsWith('0.4')) v04 += n;
              else older += n;
            }
            const pct = (x) => (100 * x / total).toFixed(2);
            const rows = [
              ['drizzle-orm 1.x', v1, pct(v1)],
              ['drizzle-orm 0.4x', v04, pct(v04)],
              ['drizzle-orm below 0.4', older, pct(older)],
            ];
            const out = ['| line | last week | share |', '| --- | ---: | ---: |']
              .concat(rows.map(([a, b, c]) => '| ' + a + ' | ' + b.toLocaleString() + ' | ' + c + '% |'))
              .join('\n');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + '\n');
            console.log(out);
          "

  # The gate itself, against the versions the registry serves rather than the versions it pins.
  # Identical to the verify-packed job in ci.yml except for the two overrides and the service
  # container being the same one, so a failure here means the new upstream release broke something
  # this project claims.
  gate-on-published:
    if: github.repository == 'use-drzl/drzl'
    needs: pins
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drzl
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify the packed artefacts against the published versions
        id: verify
        env:
          MYSQL_URL: mysql://root:root@127.0.0.1:3306/drzl
          DRIZZLE_0_4X: ${{ needs.pins.outputs.latest }}
          DRIZZLE_V1: ${{ needs.pins.outputs.rc }}
        run: |
          set -o pipefail
          pnpm verify:packed 2>&1 | tee /tmp/verify-packed.log
      - name: Name what failed
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          stage=$(awk '$1 == "==>" { sub(/^[[:space:]]*==>[[:space:]]*/, ""); s = $0 } END { print s }' /tmp/verify-packed.log)
          fail=$(awk '{ t = $0; sub(/^[[:space:]]+/, "", t); if (index(t, "FAIL") == 1) s = t } END { print s }' /tmp/verify-packed.log)
          echo "::error title=nightly gate: ${stage:-unknown stage}::${fail:-the gate exited non-zero without printing a FAIL line}"
          {
            echo "### the gate failed against published versions"
            echo
            echo "drizzle-orm 0.4x: ${DRIZZLE_0_4X}, v1: ${DRIZZLE_V1}"
            echo
            echo "Stage: **${stage:-unknown}**"
            echo
            echo "> ${fail:-no FAIL line}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DRIZZLE_0_4X: ${{ needs.pins.outputs.latest }}
          DRIZZLE_V1: ${{ needs.pins.outputs.rc }}

  # The other half of the same trade. ci.yml pins Bun and Deno to the versions docs/guide/runtimes.md
  # names, so the page is exactly true and an upstream runtime regression is invisible. This runs the
  # same script on whatever each project ships today.
  runtimes-latest:
    if: github.repository == 'use-drzl/drzl'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: vx.x.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Bun and Deno, at whatever they ship today
        run: |
          set -o pipefail
          bash scripts/runtime-compat.sh 2>&1 | tee /tmp/runtime-compat.log
      - name: Record the versions this run actually measured
        if: always()
        run: |
          awk '$1 == "==>" { on = ($2 == "runtimes"); next } on && NF { print "    " $0 }' \
            /tmp/runtime-compat.log >> "$GITHUB_STEP_SUMMARY"

  # A nightly that opens nothing is a cron job that turns red in a tab nobody opens. One issue,
  # reused rather than duplicated, assigned, and closed by the run that goes green again.
  report:
    if: always() && github.repository == 'use-drzl/drzl'
    needs: [pins, gate-on-published, runtimes-latest, unpublished-master]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const TITLE = 'Nightly: upstream drizzle-orm or runtime check is failing';
            const LABEL = 'nightly';
            const ASSIGNEE = 'omar-dulaimi';
            const results = {
              pins: '${{ needs.pins.result }}',
              'gate-on-published': '${{ needs.gate-on-published.result }}',
              'runtimes-latest': '${{ needs.runtimes-latest.result }}',
              'unpublished-master': '${{ needs.unpublished-master.result }}',
            };
            const failed = Object.entries(results).filter(([, r]) => r === 'failure');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });
            const existing = open.find((i) => i.title === TITLE);

            if (failed.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: existing.number,
                  body: `Green again on ${run}. Closing; the next failure reopens this issue.`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }

            const body = [
              `Failed jobs: ${failed.map(([j]) => j).join(', ')}.`,
              '',
              `Run: ${run}`,
              '',
              'What the gate pins today:',
              `- drizzle-orm 0.4x: \`${{ needs.pins.outputs.pinned_0_4x }}\``,
              `- drizzle-orm v1: \`${{ needs.pins.outputs.pinned_v1 }}\``,
              '',
              'What the registry serves today:',
              `- \`latest\`: \`${{ needs.pins.outputs.latest }}\``,
              `- \`rc\`: \`${{ needs.pins.outputs.rc }}\``,
              '',
              'The failing job summary names the stage and quotes its FAIL line.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: TITLE,
                labels: [LABEL],
                assignees: [ASSIGNEE],
                body,
              });
            }
