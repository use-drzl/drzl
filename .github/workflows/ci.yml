name: ci
on:
  push:
    paths-ignore:
      - 'docs/**'
  pull_request:
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # v6 is the first action-setup major that supports pnpm 11.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 declares engines.node ">=22.13", so Node 20 can no longer run it.
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Runs tsc over the ten publishable packages. This was never wired into CI, which is
      # how it came to be failing unnoticed.
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm lint

  changeset-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch master branch
        run: git fetch origin master:master
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check for changeset
        run: pnpm changeset status --verbose
