name: ci
concurrency:
  # Superseded runs on the same pull request are cancelled; pushes to master are not, because the
  # release workflow starts from the same push and a cancelled CI run there would leave the only
  # record of that commit's gate incomplete.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    paths-ignore:
      - 'docs/**'
  pull_request:
jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # v6 is the first action-setup major that supports pnpm 11.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # pnpm 11 declares engines.node ">=22.13", so Node 20 can no longer run it.
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Runs tsc over the ten publishable packages. This was never wired into CI, which is
      # how it came to be failing unnoticed.
      - run: pnpm typecheck
      - run: pnpm -r test
      # The analyzer fuzz baseline (test/fuzz/expected.json) was wired into neither CI nor
      # verify-packed, so it rotted silently: two entries kept "reproducing" months after their
      # columns were fixed, and nobody saw the gate's own delete-these message. Cheap to run,
      # and a baseline that fails the build cannot rot.
      - run: pnpm -C packages/analyzer fuzz:gate
      - run: pnpm lint

  # Bun and Deno, against the packed tarballs. Everything else in CI runs only on Node, so nothing
  # else would notice a generator whose output depends on which runtime ran it. One did: Bun's
  # resolver auto-installs a missing package from npm, so @biomejs/biome was fetched mid-generate
  # and reformatted the output on a project that never depended on it, which then made
  # `generate --check` fail back on Node.
  #
  # Versions are pinned to the ones docs/guide/runtimes.md names, so the page and the gate cannot
  # drift apart. That deliberately trades early warning of an upstream regression for a claim that
  # is exactly true; a scheduled job on the latest of each is the shape to add if the trade stops
  # being worth it, and it belongs with plan item 99's nightly rather than here.
  runtime-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: bash scripts/runtime-compat.sh

  # Everything above imports from source. This job is the only one that exercises what a
  # consumer actually gets: the packed tarballs, installed with npm into a tree that shares
  # nothing with this workspace, driven through `drzl generate`, with the emitted output
  # typechecked under every moduleResolution TypeScript still supports.
  #
  # It is deliberately a separate job rather than another step, so a green build-test-lint
  # can never be mistaken for a shippable artefact.
  verify-packed:
    runs-on: ubuntu-latest
    # Postgres and SQLite both run in-process, via PGlite and node:sqlite. MySQL has no such
    # engine, so it is the one dialect that needs a server. Without MYSQL_URL the stage skips and
    # says so, which keeps a local run honest about covering less.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: drzl
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Verify the packed artefacts
        id: verify
        env:
          MYSQL_URL: mysql://root:root@127.0.0.1:3306/drzl
        run: |
          set -o pipefail
          pnpm verify:packed 2>&1 | tee /tmp/verify-packed.log

      # The gate has 62 exit sites and 159 FAIL lines, and none of them reach the checks page: a
      # failed step shows "Process completed with exit code 1" and the authored FAIL line sits
      # somewhere inside about 670 lines of output. This lifts that line, and the stage heading
      # above it, onto the annotation and the job summary, so a reader learns which stage died
      # without opening the log.
      - name: Name what failed
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          stage=$(awk '$1 == "==>" { sub(/^[[:space:]]*==>[[:space:]]*/, ""); s = $0 } END { print s }' /tmp/verify-packed.log)
          fail=$(awk '{ t = $0; sub(/^[[:space:]]+/, "", t); if (index(t, "FAIL") == 1) s = t } END { print s }' /tmp/verify-packed.log)
          echo "::error title=verify-packed: ${stage:-unknown stage}::${fail:-the gate exited non-zero without printing a FAIL line}"
          {
            echo "### verify-packed failed"
            echo
            echo "Stage: **${stage:-unknown}**"
            echo
            echo "> ${fail:-no FAIL line was printed, so the gate died on an unguarded command}"
          } >> "$GITHUB_STEP_SUMMARY"

  changeset-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch master branch
        run: git fetch origin master:master
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check for changeset
        run: pnpm changeset status --verbose
