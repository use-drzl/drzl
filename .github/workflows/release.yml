name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # provenance
      pull-requests: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install the PNPM version declared in package.json -> "packageManager": "pnpm@10.15.1"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # ⚠️ Do NOT pass 'version' here; it will read packageManager automatically

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1, which ships with Node 24. Node 22 carries npm 10
          # and cannot perform the OIDC exchange.
          node-version: 24
          # Deliberately no `registry-url`: it writes an .npmrc holding an authToken placeholder,
          # which with no token present gets in the way of the OIDC exchange.

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --sort --workspace-concurrency=1 --filter '{packages/*}' run build

      - name: Changesets (PR + publish on merge)
        uses: changesets/action@v1
        with:
          version: pnpm -w changeset:version
          commit: 'chore(release): publish'
          title: 'Version Packages'
          createGithubReleases: true
          publish: pnpm -w changeset publish
        env:
          # No npm token: npm 11.5.1+ performs the OIDC exchange itself when publishing from Actions
          # with `id-token: write`, which is granted above. Provenance comes with it.
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
