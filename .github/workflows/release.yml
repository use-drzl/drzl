name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
  # The OIDC rehearsal has to live in THIS file. npm matches a trusted publisher on the exact
  # workflow filename and allows only one per package, so a separate dry-run workflow can never
  # authenticate: its token carries its own filename and the exchange returns 404 whether or not
  # the publisher is correctly configured. That makes a standalone rehearsal worse than useless,
  # since its failure is indistinguishable from a genuinely missing publisher.
  #
  # Dispatch against the changeset-release/master branch. On master every version already exists
  # on the registry, so recursive publish skips them all and nothing is exercised.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse the OIDC exchange without publishing anything
        type: boolean
        default: true

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # the npm OIDC exchange below, and provenance
      pull-requests: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install the pnpm version declared in package.json -> "packageManager": "pnpm@11.17.0"
      # v6 is the first action-setup major that supports pnpm 11.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Do NOT pass 'version' here; it reads packageManager automatically.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 declares engines.node ">=22.13". The bundled npm version is irrelevant:
          # `changeset publish` shells out to `pnpm publish`, not `npm publish`, so it is
          # pnpm's version that has to support the OIDC exchange. See the publish step.
          node-version: 24
          # Deliberately no `registry-url`: it writes an .npmrc holding an authToken
          # placeholder. pnpm overwrites that token only when the exchange succeeds, so on a
          # failed exchange the placeholder is what gets sent and you get a bare 401 instead
          # of pnpm's "Skipped OIDC" diagnostic.

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --sort --workspace-concurrency=1 --filter '{packages/*}' run build

      # Gate the publish on the artefact, not on the workspace. This has to live here; the
      # `verify-packed` job in ci.yml does not cover the release for two separate reasons.
      #
      # First, the "Version Packages" PR never runs CI at all. The changesets action pushes
      # that branch and opens the PR with the default GITHUB_TOKEN, and GitHub suppresses
      # workflow triggers for token-authored events to prevent recursion. So the one PR that
      # decides what gets published carries no checks, and no amount of adding jobs to ci.yml
      # changes that.
      #
      # Second, on the master push that follows the merge, ci.yml and this workflow start
      # together and nothing makes the publish wait for CI. A failure would surface after the
      # version was already on npm, where versions are immutable.
      #
      # Running here also means packing happens after the version bump, so it checks the exact
      # tarballs that are about to be published rather than the previous ones.
      - name: Verify the packed artefacts
        run: pnpm verify:packed

      # Runs the real exchange for every package and stops short of the upload, from the same
      # workflow filename the trusted publishers are registered against, so a pass here means
      # the publishers really are configured correctly.
      - name: Rehearse trusted publishing (publishes nothing)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -o pipefail
          pnpm -r --filter='{packages/*}' publish \
            --dry-run --no-git-checks 2>&1 | tee /tmp/dry-run.log

          # pnpm logs a failed exchange as a warning and exits 0, so without this the job goes
          # green having authenticated nothing.
          if grep -q 'Skipped OIDC' /tmp/dry-run.log; then
            echo
            echo "FAIL: the OIDC exchange did not succeed for every package."
            echo "Packages still without a working trusted publisher:"
            # -A1: pnpm prints the warning first and the package on the NEXT line.
            grep -A1 'Skipped OIDC' /tmp/dry-run.log \
              | grep -oE '@drzl/[a-z-]+@[0-9][^ ]*' | sed 's/^/  /' || true
            echo
            echo "On npmjs.com: package page, Settings, Trusted Publisher, GitHub Actions."
            echo "  Organization or user: use-drzl"
            echo "  Repository:           drzl"
            echo "  Workflow filename:    release.yml"
            echo "  Environment:          leave blank"
            exit 1
          fi

          echo "OK: every package completed the OIDC exchange. Safe to merge the release PR."

      # Gated so a dispatched rehearsal can never publish. Pushes behave exactly as before, and
      # dispatching with dry_run unchecked is the manual release path.
      - name: Changesets (PR + publish on merge)
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: changesets/action@v1
        with:
          version: pnpm -w changeset:version
          commit: 'chore(release): publish'
          title: 'Version Packages'
          createGithubReleases: true
          publish: pnpm -w changeset publish
        env:
          # No npm token: auth is the OIDC exchange alone, using the `id-token: write` granted
          # above. `changeset publish` spawns `pnpm publish`, and pnpm 11 then requests an ID
          # token from ACTIONS_ID_TOKEN_REQUEST_URL with audience `npm:registry.npmjs.org`,
          # POSTs it to /-/npm/v1/oidc/token/exchange/package/<name>, and publishes with the
          # token that comes back. No pnpm 10.x contains that code path, which is why
          # "packageManager" has to stay on pnpm 11 or newer for this step to authenticate.
          # The exchange is per package name, so every one of the ten packages needs a trusted
          # publisher configured on npmjs pointing at this repo and this workflow file.
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
