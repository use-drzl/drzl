name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # the npm OIDC exchange below, and provenance
      pull-requests: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install the pnpm version declared in package.json -> "packageManager": "pnpm@11.17.0"
      # v6 is the first action-setup major that supports pnpm 11.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # Do NOT pass 'version' here; it reads packageManager automatically.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 declares engines.node ">=22.13". The bundled npm version is irrelevant:
          # `changeset publish` shells out to `pnpm publish`, not `npm publish`, so it is
          # pnpm's version that has to support the OIDC exchange. See the publish step.
          node-version: 24
          # Deliberately no `registry-url`: it writes an .npmrc holding an authToken
          # placeholder. pnpm overwrites that token only when the exchange succeeds, so on a
          # failed exchange the placeholder is what gets sent and you get a bare 401 instead
          # of pnpm's "Skipped OIDC" diagnostic.

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --sort --workspace-concurrency=1 --filter '{packages/*}' run build

      - name: Changesets (PR + publish on merge)
        uses: changesets/action@v1
        with:
          version: pnpm -w changeset:version
          commit: 'chore(release): publish'
          title: 'Version Packages'
          createGithubReleases: true
          publish: pnpm -w changeset publish
        env:
          # No npm token: auth is the OIDC exchange alone, using the `id-token: write` granted
          # above. `changeset publish` spawns `pnpm publish`, and pnpm 11 then requests an ID
          # token from ACTIONS_ID_TOKEN_REQUEST_URL with audience `npm:registry.npmjs.org`,
          # POSTs it to /-/npm/v1/oidc/token/exchange/package/<name>, and publishes with the
          # token that comes back. No pnpm 10.x contains that code path, which is why
          # "packageManager" has to stay on pnpm 11 or newer for this step to authenticate.
          # The exchange is per package name, so every one of the ten packages needs a trusted
          # publisher configured on npmjs pointing at this repo and this workflow file.
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
