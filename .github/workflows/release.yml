name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # provenance
      pull-requests: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install the PNPM version declared in package.json -> "packageManager": "pnpm@10.15.1"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # ⚠️ Do NOT pass 'version' here; it will read packageManager automatically

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24 so the bundled npm is >= 11.5.1. Note this alone does NOT enable trusted
          # publishing here: `changeset publish` shells out to `pnpm publish`, not `npm publish`,
          # so it is pnpm's version that has to support the OIDC exchange. See the publish step.
          node-version: 24
          # Deliberately no `registry-url`: it writes an .npmrc holding an authToken placeholder,
          # which with no token present gets in the way of the OIDC exchange.

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r --sort --workspace-concurrency=1 --filter '{packages/*}' run build

      - name: Changesets (PR + publish on merge)
        uses: changesets/action@v1
        with:
          version: pnpm -w changeset:version
          commit: 'chore(release): publish'
          title: 'Version Packages'
          createGithubReleases: true
          publish: pnpm -w changeset publish
        env:
          # No npm token: auth is meant to be the OIDC exchange alone, using the `id-token: write`
          # granted above. BLOCKER: `changeset publish` delegates to `pnpm publish`, and no pnpm 10.x
          # can do that exchange (no /-/npm/v1/oidc/token/exchange call exists in the binary); the
          # first release that supports it is pnpm 11. Until "packageManager" in package.json is
          # moved to pnpm@11+, this step authenticates with nothing and publishes nothing.
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
